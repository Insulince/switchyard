# Runs on every push and pull request.
# It is the minimum that lets a pull request prove itself without
# a maintainer having to build it by hand.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # gofmt has no failing exit code of its own -- it prints the files it
      # would change and exits 0 -- so the check is "did it print anything".
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The dashboard is embedded into the binary by go:embed, so a syntax
      # error in it compiles clean and only surfaces in somebody's browser.
      # Node is preinstalled on ubuntu-latest and the script only needs
      # require(), so there is nothing to set up.
      - name: check the embedded dashboard parses
        run: node tools/checkjs.js
