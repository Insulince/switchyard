# Cut a release by pushing a tag:
#
#   git tag -a v0.1.0 -m "first public release"
#   git push origin v0.1.0
#
# The tag is the only place the version is written down. This workflow reads
# it, stamps it into the binaries and the container image, and publishes both.
# There is no version constant to bump and no file to forget.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release
  packages: write   # to push the image to ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Build the same four targets people actually run this on. CGO is off
      # everywhere, so cross-compiling needs no toolchain beyond Go itself.
      - name: build
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "dist/switchyard-${os}-${arch}${ext}" .
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu-action: the Dockerfile cross-compiles from the native
      # builder, so nothing is emulated.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both the exact version and a moving :latest, so a compose file can
      # pin or track, whichever the operator prefers.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
